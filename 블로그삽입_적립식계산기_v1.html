    style="padding:14px 28px;border:0;border-radius:12px;background:#2457d6;color:#fff;font-size:16px;font-weight:700;cursor:pointer;box-shadow:0 2px 8px rgba(36,87,214,.3);">

</div>
<script>
(function () {
  var CALC_HTML = "<!doctype html>\n<html lang=\"ko\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width,initial-scale=1\">\n<title>적립식 투자 계산기<\/title>\n<style>\n:root{--bg:#f4f6fa;--card:#fff;--ink:#1b2430;--sub:#667385;--line:#e1e6ee;--accent:#2457d6;--accent2:#e6edfc;--gain:#1a8f5b;--prin:#b7c1d1;--btntxt:#fff}\n@media (prefers-color-scheme:dark){:root{--bg:#12161c;--card:#1b212a;--ink:#e8ecf2;--sub:#9aa5b5;--line:#2c3542;--accent:#7aa2ff;--accent2:#1f2b46;--gain:#4fd19a;--prin:#4a5566;--btntxt:#0b1220}}\n*{box-sizing:border-box}\nbody{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 -apple-system,BlinkMacSystemFont,\"Apple SD Gothic Neo\",\"Malgun Gothic\",\"Noto Sans KR\",Arial,sans-serif}\n.wrap{max-width:760px;margin:0 auto;padding:20px 16px 40px}\nh1{font-size:22px;margin:4px 0 6px}\nh2{font-size:16px;margin:0 0 10px}\n.lead{margin:0 0 16px;color:var(--sub);font-size:14px}\n.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:14px}\n.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}\n.grid>label{min-width:0}\n@media (max-width:560px){.grid{grid-template-columns:minmax(0,1fr)}}\nlabel{display:block;font-size:13px;color:var(--sub)}\n.inp{display:flex;align-items:center;margin-top:4px;border:1px solid var(--line);border-radius:10px;background:var(--bg);padding:0 12px}\n.inp:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent2)}\n.inp input{flex:1;min-width:0;width:100%;border:0;background:transparent;color:var(--ink);font:inherit;font-size:18px;font-weight:600;padding:10px 0;outline:0;text-align:right}\n.inp em{font-style:normal;color:var(--sub);margin-left:6px;font-size:14px}\ndetails{margin-top:12px;font-size:14px}\nsummary{cursor:pointer;color:var(--accent)}\n.opts{display:grid;gap:10px;margin-top:10px}\nselect{width:100%;margin-top:4px;padding:9px 10px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:inherit;font-size:14px}\n.err{color:#c0392b;font-size:13px;margin:10px 0 0}\n.err:empty{display:none}\n.result.dim .big,.result.dim .kr,.result.dim .stats{opacity:.35}\n.lbl{font-size:13px;color:var(--sub)}\n.big{font-size:clamp(26px,6vw,38px);font-weight:800;color:var(--accent);letter-spacing:-.5px;word-break:keep-all}\n.kr{font-size:15px;margin-bottom:12px}\n.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;border-top:1px solid var(--line);padding-top:12px}\n@media (max-width:560px){.stats{grid-template-columns:minmax(0,1fr)}th,td{padding:7px 6px;font-size:12px}.hint{display:block!important}}\n.hint{display:none;font-size:12px;color:var(--sub);margin:6px 2px 0}\n.stats span{display:block;font-size:12px;color:var(--sub)}\n.stats b{font-size:15px;word-break:keep-all}\n.cross{font-size:13px;color:var(--sub);margin:12px 0 6px}\n#chart svg{width:100%;height:auto;display:block}\n.p{fill:var(--prin)}.g{fill:var(--gain)}\n.axis{fill:var(--sub);font-size:11px}\n.legend{font-size:12px;color:var(--sub);margin:4px 0 14px}\n.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin:0 4px 0 12px}\n.legend i:first-child{margin-left:0}\n.d1{background:var(--prin)}.d2{background:var(--gain)}\n.btn{width:100%;padding:13px 16px;border:0;border-radius:12px;background:var(--accent);color:var(--btntxt);font:inherit;font-weight:700;cursor:pointer}\n.btn:disabled{opacity:.4;cursor:not-allowed}\n.tbl{max-height:340px;overflow:auto;border:1px solid var(--line);border-radius:10px}\ntable{width:100%;border-collapse:collapse;font-size:13px;font-variant-numeric:tabular-nums}\nth,td{padding:7px 10px;text-align:right;white-space:nowrap}\nth{position:sticky;top:0;background:var(--accent2);color:var(--ink);font-weight:700}\ntbody tr:nth-child(even){background:var(--bg)}\ntd:first-child,th:first-child{text-align:center}\n.note{font-size:12px;color:var(--sub);margin:4px 2px 0}\n<\/style>\n<script src=\"https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js\" defer><\/script>\n<\/head>\n<body>\n<main class=\"wrap\">\n<h1>적립식 투자 계산기<\/h1>\n<p class=\"lead\">매달 일정 금액을 납입하고 연 수익률로 불렸을 때, 시간이 지나면 얼마가 되는지 계산합니다.<\/p>\n\n<section class=\"card\">\n  <div class=\"grid\">\n    <label for=\"a\">매월 납입액<span class=\"inp\"><input id=\"a\" inputmode=\"numeric\" autocomplete=\"off\" value=\"500,000\"><em>원<\/em><\/span><\/label>\n    <label for=\"b\">연 수익률<span class=\"inp\"><input id=\"b\" inputmode=\"decimal\" autocomplete=\"off\" value=\"8\"><em>%<\/em><\/span><\/label>\n    <label for=\"c\">투자 기간<span class=\"inp\"><input id=\"c\" inputmode=\"numeric\" autocomplete=\"off\" value=\"30\"><em>년<\/em><\/span><\/label>\n  <\/div>\n  <details>\n    <summary>세부 설정<\/summary>\n    <div class=\"opts\">\n      <label for=\"t\">납입 시점\n        <select id=\"t\"><option value=\"end\">매월 말 (기본)<\/option><option value=\"begin\">매월 초<\/option><\/select>\n      <\/label>\n      <label for=\"m\">수익률 적용 방식\n        <select id=\"m\"><option value=\"nominal\">연 수익률 ÷ 12 를 매달 적용 (기본)<\/option><option value=\"eff\">연 실효 (1년 뒤 증가율 = 입력값)<\/option><\/select>\n      <\/label>\n    <\/div>\n  <\/details>\n  <p id=\"err\" class=\"err\" role=\"alert\"><\/p>\n<\/section>\n\n<section class=\"card result\" id=\"res\" aria-live=\"polite\">\n  <div class=\"lbl\"><span id=\"yrs\">30년<\/span> 후 예상 금액<\/div>\n  <div class=\"big\" id=\"final\">-<\/div>\n  <div class=\"kr\" id=\"finalKr\"><\/div>\n  <div class=\"stats\">\n    <div><span>총 납입 원금<\/span><b id=\"prin\">-<\/b><\/div>\n    <div><span>총 수익<\/span><b id=\"gain\">-<\/b><\/div>\n    <div><span>원금 대비 수익률<\/span><b id=\"pct\">-<\/b><\/div>\n  <\/div>\n  <p class=\"cross\" id=\"cross\"><\/p>\n  <div id=\"chart\"><\/div>\n  <div class=\"legend\"><i class=\"d1\"><\/i>납입 원금<i class=\"d2\"><\/i>수익<\/div>\n  <button type=\"button\" id=\"dl\" class=\"btn\">엑셀로 다운로드 (결과·계산 과정)<\/button>\n<\/section>\n\n<section class=\"card\">\n  <h2>연도별 내역<\/h2>\n  <div class=\"tbl\">\n    <table>\n      <thead><tr><th>연차<\/th><th>누적 납입<\/th><th>연말 잔액<\/th><th>누적 수익<\/th><th>그해 수익<\/th><\/tr><\/thead>\n      <tbody id=\"rows\"><\/tbody>\n    <\/table>\n  <\/div>\n  <p class=\"hint\">표를 좌우로 밀어서 더 볼 수 있어요.<\/p>\n<\/section>\n\n<p class=\"note\">세전 기준이며 수수료·세금·물가 상승은 반영하지 않은 단순 시뮬레이션입니다. 실제 수익률은 매년 달라지므로 결과는 참고용이며 투자 권유가 아닙니다.<\/p>\n<\/main>\n\n<script>\n(function(){\n  var $ = function(id){ return document.getElementById(id); };\n  var nf = new Intl.NumberFormat('ko-KR');\n  var state = null;\n\n  function won(x){ return nf.format(Math.round(x)) + '원'; }\n  function kr(n){\n    n = Math.floor(n);\n    if (n < 10000) return nf.format(n) + '원';\n    var jo = Math.floor(n / 1e12), eok = Math.floor((n % 1e12) / 1e8), man = Math.floor((n % 1e8) / 1e4), s = '';\n    if (jo) s += nf.format(jo) + '조 ';\n    if (eok) s += nf.format(eok) + '억 ';\n    if (man) s += nf.format(man) + '만';\n    return s.trim() + '원';\n  }\n  function num(s){ return parseFloat(String(s).replace(/[,\\s원%년]/g, '')); }\n\n  function readInputs(){\n    var A = num($('a').value), B = num($('b').value), C = num($('c').value), e = '';\n    if (!isFinite(A) || A <= 0) e = '매월 납입액을 1원 이상으로 입력해 주세요.';\n    else if (A > 1e10) e = '매월 납입액이 너무 큽니다.';\n    else if (!isFinite(B) || B < 0 || B > 100) e = '연 수익률은 0~100% 사이로 입력해 주세요.';\n    else if (!isFinite(C) || C < 1 || C > 60 || Math.floor(C) !== C) e = '투자 기간은 1~60년 사이의 정수로 입력해 주세요.';\n    return {A: A, B: B, C: C, e: e, timing: $('t').value, mode: $('m').value};\n  }\n\n  function simulate(p){\n    var n = p.C * 12;\n    var r = p.mode === 'nominal' ? p.B / 100 / 12 : Math.pow(1 + p.B / 100, 1 / 12) - 1;\n    var bal = 0, months = [], yearly = [], prevEnd = 0, cross = null;\n    for (var m = 1; m <= n; m++){\n      var begin = bal, interest, end;\n      if (p.timing === 'end'){ interest = begin * r; end = begin + interest + p.A; }\n      else { interest = (begin + p.A) * r; end = begin + p.A + interest; }\n      bal = end;\n      months.push({m: m, y: Math.ceil(m / 12), begin: begin, dep: p.A, interest: interest, end: end});\n      if (cross === null && end - p.A * m > p.A * m) cross = m;\n      if (m % 12 === 0){\n        var dep = p.A * m, y = m / 12;\n        yearly.push({y: y, dep: dep, end: end, gain: end - dep, yGain: end - prevEnd - p.A * 12});\n        prevEnd = end;\n      }\n    }\n    return {p: p, r: r, n: n, months: months, yearly: yearly, cross: cross, final: bal, dep: p.A * n};\n  }\n\n  function chart(y){\n    var W = Math.max(280, Math.round($('chart').clientWidth || 640)), H = 220, pl = 6, pb = 22, pt = 14, n = y.length;\n    var max = Math.max.apply(null, y.map(function(r){ return r.end; }));\n    var bw = (W - pl * 2) / n, plot = H - pb - pt, s = '';\n    s += '<svg viewBox=\"0 0 ' + W + ' ' + H + '\" role=\"img\" aria-label=\"연도별 납입 원금과 수익\">';\n    var step = Math.ceil(n / Math.max(3, Math.floor(W / 52)));\n    y.forEach(function(r, i){\n      var x = pl + i * bw + bw * 0.12, w = bw * 0.76;\n      var hp = plot * r.dep / max, hg = plot * r.gain / max, yb = H - pb;\n      s += '<g><title>' + r.y + '년차 · 잔액 ' + kr(r.end) + '<\/title>' +\n           '<rect class=\"p\" x=\"' + x.toFixed(1) + '\" y=\"' + (yb - hp).toFixed(1) + '\" width=\"' + w.toFixed(1) + '\" height=\"' + hp.toFixed(1) + '\"/>' +\n           '<rect class=\"g\" x=\"' + x.toFixed(1) + '\" y=\"' + (yb - hp - hg).toFixed(1) + '\" width=\"' + w.toFixed(1) + '\" height=\"' + hg.toFixed(1) + '\"/><\/g>';\n      if ((i + 1) % step === 0 || i === n - 1){\n        s += '<text class=\"axis\" text-anchor=\"middle\" x=\"' + (pl + i * bw + bw / 2).toFixed(1) + '\" y=\"' + (H - 6) + '\">' + r.y + '년<\/text>';\n      }\n    });\n    s += '<text class=\"axis\" x=\"' + pl + '\" y=\"10\">최대 ' + kr(max) + '<\/text><\/svg>';\n    $('chart').innerHTML = s;\n  }\n\n  function render(){\n    var p = readInputs();\n    $('err').textContent = p.e;\n    $('dl').disabled = !!p.e;\n    $('res').classList.toggle('dim', !!p.e);\n    if (p.e) return;\n    var s = simulate(p);\n    state = s;\n    var gain = s.final - s.dep;\n    $('yrs').textContent = p.C + '년';\n    $('final').textContent = won(s.final);\n    $('finalKr').textContent = '약 ' + kr(s.final);\n    $('prin').textContent = won(s.dep);\n    $('gain').textContent = won(gain);\n    $('pct').textContent = (s.dep ? (gain / s.dep * 100) : 0).toFixed(1) + '%';\n    if (p.B === 0) $('cross').textContent = '수익률이 0%라 수익이 발생하지 않습니다.';\n    else if (s.cross) $('cross').textContent = '누적 수익이 누적 납입 원금을 넘어서는 시점: ' + Math.floor((s.cross - 1) / 12) + '년 ' + (((s.cross - 1) % 12) + 1) + '개월째 (' + s.cross + '번째 납입 이후)';\n    else $('cross').textContent = '이 기간 안에는 누적 수익이 누적 납입 원금을 넘지 못합니다.';\n    chart(s.yearly);\n    $('rows').innerHTML = s.yearly.map(function(r){\n      return '<tr><td>' + r.y + '년<\/td><td>' + nf.format(Math.round(r.dep)) + '<\/td><td>' + nf.format(Math.round(r.end)) + '<\/td><td>' + nf.format(Math.round(r.gain)) + '<\/td><td>' + nf.format(Math.round(r.yGain)) + '<\/td><\/tr>';\n    }).join('');\n  }\n\n  /* ---------- 엑셀 다운로드 ---------- */\n  function cell(ws, addr, v, z, f){\n    var c = typeof v === 'number' ? {t: 'n', v: v} : {t: 's', v: v};\n    if (z) c.z = z;\n    if (f) c.f = f;\n    ws[addr] = c;\n  }\n  function download(blob, name){\n    var a = document.createElement('a');\n    a.href = URL.createObjectURL(blob);\n    a.download = name;\n    document.body.appendChild(a);\n    a.click();\n    setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); }, 1000);\n  }\n  function exportCsv(s){\n    var L = ['월,연차,기초 잔액,납입,수익,기말 잔액'];\n    s.months.forEach(function(r){\n      L.push([r.m, r.y, r.begin.toFixed(2), r.dep, r.interest.toFixed(2), r.end.toFixed(2)].join(','));\n    });\n    download(new Blob(['﻿' + L.join('\\r\\n')], {type: 'text/csv;charset=utf-8'}), '적립식투자계산_월별_v1.csv');\n  }\n  function exportXlsx(){\n    var s = state; if (!s) return;\n    if (!window.XLSX){ exportCsv(s); alert('엑셀 라이브러리를 불러오지 못해 CSV 파일로 내려받았습니다. (인터넷 연결을 확인해 주세요)'); return; }\n    var p = s.p, n = s.n, last = n + 1, MONEY = '#,##0', wb = XLSX.utils.book_new();\n    var timingTxt = p.timing === 'end' ? '월말' : '월초';\n    var modeTxt = p.mode === 'nominal' ? '연÷12' : '연실효';\n    var gain = s.final - s.dep;\n\n    var S = {};\n    cell(S, 'A1', '적립식 투자 계산 결과');\n    cell(S, 'A3', '[입력값]');\n    cell(S, 'A4', '매월 납입액(원)'); cell(S, 'B4', p.A, MONEY);\n    cell(S, 'A5', '연 수익률'); cell(S, 'B5', p.B / 100, '0.00%');\n    cell(S, 'A6', '투자 기간(년)'); cell(S, 'B6', p.C);\n    cell(S, 'A7', '납입 시점'); cell(S, 'B7', timingTxt); cell(S, 'C7', \"'월말' 또는 '월초'를 입력\");\n    cell(S, 'A8', '수익률 적용 방식'); cell(S, 'B8', modeTxt); cell(S, 'C8', \"'연÷12'(연 수익률÷12를 매달 적용) 또는 '연실효'\");\n    cell(S, 'A9', '월 수익률'); cell(S, 'B9', s.r, '0.0000%', 'IF(B8=\"연실효\",(1+B5)^(1/12)-1,B5/12)');\n    cell(S, 'A11', '[결과]');\n    cell(S, 'A12', '최종 금액(원)'); cell(S, 'B12', s.final, MONEY, \"'월별'!F\" + last);\n    cell(S, 'A13', '총 납입 원금(원)'); cell(S, 'B13', s.dep, MONEY, 'B4*B6*12');\n    cell(S, 'A14', '총 수익(원)'); cell(S, 'B14', gain, MONEY, 'B12-B13');\n    cell(S, 'A15', '원금 대비 수익률'); cell(S, 'B15', s.dep ? gain / s.dep : 0, '0.0%', 'B14/B13');\n    cell(S, 'A16', '공식 검산(원)'); cell(S, 'B16', s.final, MONEY, 'IF(B9=0,B4*B6*12,B4*((1+B9)^(B6*12)-1)/B9*IF(B7=\"월초\",1+B9,1))');\n    cell(S, 'A17', '검산 결과'); cell(S, 'B17', '일치', null, 'IF(ABS(B16-B12)<1,\"일치\",\"불일치\")');\n    cell(S, 'A19', '※ 납입액·수익률·납입 시점·적용 방식(B4, B5, B7, B8)을 바꾸면 월별·연도별 시트가 자동으로 다시 계산됩니다.');\n    cell(S, 'A20', '※ 투자 기간은 월별 시트의 행 수로 정해지므로, 기간을 바꾸려면 웹 계산기에서 다시 내려받아 주세요.');\n    cell(S, 'A21', '※ 세전 기준이며 수수료·세금·물가 상승은 반영하지 않은 단순 시뮬레이션입니다.');\n    S['!ref'] = 'A1:C21';\n    S['!cols'] = [{wch: 24}, {wch: 20}, {wch: 52}];\n    XLSX.utils.book_append_sheet(wb, S, '요약');\n\n    var Y = {};\n    ['연차', '누적 납입(원)', '연말 잔액(원)', '누적 수익(원)', '그해 수익(원)'].forEach(function(h, i){ cell(Y, 'ABCDE'[i] + '1', h); });\n    s.yearly.forEach(function(r, i){\n      var row = i + 2;\n      cell(Y, 'A' + row, r.y);\n      ce
