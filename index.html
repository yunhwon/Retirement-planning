<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>적립식 투자 계산기</title>
<meta name="description" content="매월 납입액·연 수익률·기간을 넣으면 예상 금액과 엑셀 계산 과정을 확인할 수 있어요.">
<meta property="og:type" content="website">
<meta property="og:locale" content="ko_KR">
<meta property="og:title" content="적립식 투자 계산기">
<meta property="og:description" content="매월 납입액·연 수익률·기간을 넣으면 예상 금액과 엑셀 계산 과정을 확인할 수 있어요.">
<meta property="og:url" content="https://yunhwon.github.io/Retirement-planning/">
<style>
:root{--bg:#f4f6fa;--card:#fff;--ink:#1b2430;--sub:#667385;--line:#e1e6ee;--accent:#2457d6;--accent2:#e6edfc;--gain:#1a8f5b;--prin:#b7c1d1;--btntxt:#fff}
@media (prefers-color-scheme:dark){:root{--bg:#12161c;--card:#1b212a;--ink:#e8ecf2;--sub:#9aa5b5;--line:#2c3542;--accent:#7aa2ff;--accent2:#1f2b46;--gain:#4fd19a;--prin:#4a5566;--btntxt:#0b1220}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 -apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",Arial,sans-serif}
.wrap{max-width:760px;margin:0 auto;padding:20px 16px 40px}
h1{font-size:22px;margin:4px 0 6px}
h2{font-size:16px;margin:0 0 10px}
.lead{margin:0 0 16px;color:var(--sub);font-size:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:14px}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.grid>label{min-width:0}
@media (max-width:560px){.grid{grid-template-columns:minmax(0,1fr)}}
label{display:block;font-size:13px;color:var(--sub)}
.inp{display:flex;align-items:center;margin-top:4px;border:1px solid var(--line);border-radius:10px;background:var(--bg);padding:0 12px}
.inp:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent2)}
.inp input{flex:1;min-width:0;width:100%;border:0;background:transparent;color:var(--ink);font:inherit;font-size:18px;font-weight:600;padding:10px 0;outline:0;text-align:right}
.inp em{font-style:normal;color:var(--sub);margin-left:6px;font-size:14px}
details{margin-top:12px;font-size:14px}
summary{cursor:pointer;color:var(--accent)}
.opts{display:grid;gap:10px;margin-top:10px}
select{width:100%;margin-top:4px;padding:9px 10px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:inherit;font-size:14px}
.err{color:#c0392b;font-size:13px;margin:10px 0 0}
.err:empty{display:none}
.result.dim .big,.result.dim .kr,.result.dim .stats{opacity:.35}
.lbl{font-size:13px;color:var(--sub)}
.big{font-size:clamp(26px,6vw,38px);font-weight:800;color:var(--accent);letter-spacing:-.5px;word-break:keep-all}
.kr{font-size:15px;margin-bottom:12px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;border-top:1px solid var(--line);padding-top:12px}
@media (max-width:560px){.stats{grid-template-columns:minmax(0,1fr)}th,td{padding:7px 6px;font-size:12px}.hint{display:block!important}}
.hint{display:none;font-size:12px;color:var(--sub);margin:6px 2px 0}
.stats span{display:block;font-size:12px;color:var(--sub)}
.stats b{font-size:15px;word-break:keep-all}
.cross{font-size:13px;color:var(--sub);margin:12px 0 6px}
#chart svg{width:100%;height:auto;display:block}
.p{fill:var(--prin)}.g{fill:var(--gain)}
.axis{fill:var(--sub);font-size:11px}
.legend{font-size:12px;color:var(--sub);margin:4px 0 14px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin:0 4px 0 12px}
.legend i:first-child{margin-left:0}
.d1{background:var(--prin)}.d2{background:var(--gain)}
.btn{width:100%;padding:13px 16px;border:0;border-radius:12px;background:var(--accent);color:var(--btntxt);font:inherit;font-weight:700;cursor:pointer}
.btn:disabled{opacity:.4;cursor:not-allowed}
.tbl{max-height:340px;overflow:auto;border:1px solid var(--line);border-radius:10px}
table{width:100%;border-collapse:collapse;font-size:13px;font-variant-numeric:tabular-nums}
th,td{padding:7px 10px;text-align:right;white-space:nowrap}
th{position:sticky;top:0;background:var(--accent2);color:var(--ink);font-weight:700}
tbody tr:nth-child(even){background:var(--bg)}
td:first-child,th:first-child{text-align:center}
.note{font-size:12px;color:var(--sub);margin:4px 2px 0}
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js" defer></script>
</head>
<body>
<main class="wrap">
<h1>적립식 투자 계산기</h1>
<p class="lead">매달 일정 금액을 납입하고 연 수익률로 불렸을 때, 시간이 지나면 얼마가 되는지 계산합니다.</p>

<section class="card">
  <div class="grid">
    <label for="a">매월 납입액<span class="inp"><input id="a" inputmode="numeric" autocomplete="off" value="500,000"><em>원</em></span></label>
    <label for="b">연 수익률<span class="inp"><input id="b" inputmode="decimal" autocomplete="off" value="8"><em>%</em></span></label>
    <label for="c">투자 기간<span class="inp"><input id="c" inputmode="numeric" autocomplete="off" value="30"><em>년</em></span></label>
  </div>
  <details>
    <summary>세부 설정</summary>
    <div class="opts">
      <label for="t">납입 시점
        <select id="t"><option value="end">매월 말 (기본)</option><option value="begin">매월 초</option></select>
      </label>
      <label for="m">수익률 적용 방식
        <select id="m"><option value="nominal">연 수익률 ÷ 12 를 매달 적용 (기본)</option><option value="eff">연 실효 (1년 뒤 증가율 = 입력값)</option></select>
      </label>
    </div>
  </details>
  <p id="err" class="err" role="alert"></p>
</section>

<section class="card result" id="res" aria-live="polite">
  <div class="lbl"><span id="yrs">30년</span> 후 예상 금액</div>
  <div class="big" id="final">-</div>
  <div class="kr" id="finalKr"></div>
  <div class="stats">
    <div><span>총 납입 원금</span><b id="prin">-</b></div>
    <div><span>총 수익</span><b id="gain">-</b></div>
    <div><span>원금 대비 수익률</span><b id="pct">-</b></div>
  </div>
  <p class="cross" id="cross"></p>
  <div id="chart"></div>
  <div class="legend"><i class="d1"></i>납입 원금<i class="d2"></i>수익</div>
  <button type="button" id="dl" class="btn">엑셀로 다운로드 (결과·계산 과정)</button>
</section>

<section class="card">
  <h2>연도별 내역</h2>
  <div class="tbl">
    <table>
      <thead><tr><th>연차</th><th>누적 납입</th><th>연말 잔액</th><th>누적 수익</th><th>그해 수익</th></tr></thead>
      <tbody id="rows"></tbody>
    </table>
  </div>
  <p class="hint">표를 좌우로 밀어서 더 볼 수 있어요.</p>
</section>

<p class="note">세전 기준이며 수수료·세금·물가 상승은 반영하지 않은 단순 시뮬레이션입니다. 실제 수익률은 매년 달라지므로 결과는 참고용이며 투자 권유가 아닙니다.</p>
</main>

<script>
(function(){
  var $ = function(id){ return document.getElementById(id); };
  var nf = new Intl.NumberFormat('ko-KR');
  var state = null;

  function won(x){ return nf.format(Math.round(x)) + '원'; }
  function kr(n){
    n = Math.floor(n);
    if (n < 10000) return nf.format(n) + '원';
    var jo = Math.floor(n / 1e12), eok = Math.floor((n % 1e12) / 1e8), man = Math.floor((n % 1e8) / 1e4), s = '';
    if (jo) s += nf.format(jo) + '조 ';
    if (eok) s += nf.format(eok) + '억 ';
    if (man) s += nf.format(man) + '만';
    return s.trim() + '원';
  }
  function num(s){ return parseFloat(String(s).replace(/[,\s원%년]/g, '')); }

  function readInputs(){
    var A = num($('a').value), B = num($('b').value), C = num($('c').value), e = '';
    if (!isFinite(A) || A <= 0) e = '매월 납입액을 1원 이상으로 입력해 주세요.';
    else if (A > 1e10) e = '매월 납입액이 너무 큽니다.';
    else if (!isFinite(B) || B < 0 || B > 100) e = '연 수익률은 0~100% 사이로 입력해 주세요.';
    else if (!isFinite(C) || C < 1 || C > 60 || Math.floor(C) !== C) e = '투자 기간은 1~60년 사이의 정수로 입력해 주세요.';
    return {A: A, B: B, C: C, e: e, timing: $('t').value, mode: $('m').value};
  }

  function simulate(p){
    var n = p.C * 12;
    var r = p.mode === 'nominal' ? p.B / 100 / 12 : Math.pow(1 + p.B / 100, 1 / 12) - 1;
    var bal = 0, months = [], yearly = [], prevEnd = 0, cross = null;
    for (var m = 1; m <= n; m++){
      var begin = bal, interest, end;
      if (p.timing === 'end'){ interest = begin * r; end = begin + interest + p.A; }
      else { interest = (begin + p.A) * r; end = begin + p.A + interest; }
      bal = end;
      months.push({m: m, y: Math.ceil(m / 12), begin: begin, dep: p.A, interest: interest, end: end});
      if (cross === null && end - p.A * m > p.A * m) cross = m;
      if (m % 12 === 0){
        var dep = p.A * m, y = m / 12;
        yearly.push({y: y, dep: dep, end: end, gain: end - dep, yGain: end - prevEnd - p.A * 12});
        prevEnd = end;
      }
    }
    return {p: p, r: r, n: n, months: months, yearly: yearly, cross: cross, final: bal, dep: p.A * n};
  }

  function chart(y){
    var W = Math.max(280, Math.round($('chart').clientWidth || 640)), H = 220, pl = 6, pb = 22, pt = 14, n = y.length;
    var max = Math.max.apply(null, y.map(function(r){ return r.end; }));
    var bw = (W - pl * 2) / n, plot = H - pb - pt, s = '';
    s += '<svg viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="연도별 납입 원금과 수익">';
    var step = Math.ceil(n / Math.max(3, Math.floor(W / 52)));
    y.forEach(function(r, i){
      var x = pl + i * bw + bw * 0.12, w = bw * 0.76;
      var hp = plot * r.dep / max, hg = plot * r.gain / max, yb = H - pb;
      s += '<g><title>' + r.y + '년차 · 잔액 ' + kr(r.end) + '</title>' +
           '<rect class="p" x="' + x.toFixed(1) + '" y="' + (yb - hp).toFixed(1) + '" width="' + w.toFixed(1) + '" height="' + hp.toFixed(1) + '"/>' +
           '<rect class="g" x="' + x.toFixed(1) + '" y="' + (yb - hp - hg).toFixed(1) + '" width="' + w.toFixed(1) + '" height="' + hg.toFixed(1) + '"/></g>';
      if ((i + 1) % step === 0 || i === n - 1){
        s += '<text class="axis" text-anchor="middle" x="' + (pl + i * bw + bw / 2).toFixed(1) + '" y="' + (H - 6) + '">' + r.y + '년</text>';
      }
    });
    s += '<text class="axis" x="' + pl + '" y="10">최대 ' + kr(max) + '</text></svg>';
    $('chart').innerHTML = s;
  }

  function render(){
    var p = readInputs();
    $('err').textContent = p.e;
    $('dl').disabled = !!p.e;
    $('res').classList.toggle('dim', !!p.e);
    if (p.e) return;
    var s = simulate(p);
    state = s;
    var gain = s.final - s.dep;
    $('yrs').textContent = p.C + '년';
    $('final').textContent = won(s.final);
    $('finalKr').textContent = '약 ' + kr(s.final);
    $('prin').textContent = won(s.dep);
    $('gain').textContent = won(gain);
    $('pct').textContent = (s.dep ? (gain / s.dep * 100) : 0).toFixed(1) + '%';
    if (p.B === 0) $('cross').textContent = '수익률이 0%라 수익이 발생하지 않습니다.';
    else if (s.cross) $('cross').textContent = '누적 수익이 누적 납입 원금을 넘어서는 시점: ' + Math.floor((s.cross - 1) / 12) + '년 ' + (((s.cross - 1) % 12) + 1) + '개월째 (' + s.cross + '번째 납입 이후)';
    else $('cross').textContent = '이 기간 안에는 누적 수익이 누적 납입 원금을 넘지 못합니다.';
    chart(s.yearly);
    $('rows').innerHTML = s.yearly.map(function(r){
      return '<tr><td>' + r.y + '년</td><td>' + nf.format(Math.round(r.dep)) + '</td><td>' + nf.format(Math.round(r.end)) + '</td><td>' + nf.format(Math.round(r.gain)) + '</td><td>' + nf.format(Math.round(r.yGain)) + '</td></tr>';
    }).join('');
  }

  /* ---------- 엑셀 다운로드 ---------- */
  function cell(ws, addr, v, z, f){
    var c = typeof v === 'number' ? {t: 'n', v: v} : {t: 's', v: v};
    if (z) c.z = z;
    if (f) c.f = f;
    ws[addr] = c;
  }
  function download(blob, name){
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = name;
    document.body.appendChild(a);
    a.click();
    setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); }, 1000);
  }
  function exportCsv(s){
    var L = ['월,연차,기초 잔액,납입,수익,기말 잔액'];
    s.months.forEach(function(r){
      L.push([r.m, r.y, r.begin.toFixed(2), r.dep, r.interest.toFixed(2), r.end.toFixed(2)].join(','));
    });
    download(new Blob(['﻿' + L.join('\r\n')], {type: 'text/csv;charset=utf-8'}), '적립식투자계산_월별_v1.csv');
  }
  function exportXlsx(){
    var s = state; if (!s) return;
    if (!window.XLSX){ exportCsv(s); alert('엑셀 라이브러리를 불러오지 못해 CSV 파일로 내려받았습니다. (인터넷 연결을 확인해 주세요)'); return; }
    var p = s.p, n = s.n, last = n + 1, MONEY = '#,##0', wb = XLSX.utils.book_new();
    var timingTxt = p.timing === 'end' ? '월말' : '월초';
    var modeTxt = p.mode === 'nominal' ? '연÷12' : '연실효';
    var gain = s.final - s.dep;

    var S = {};
    cell(S, 'A1', '적립식 투자 계산 결과');
    cell(S, 'A3', '[입력값]');
    cell(S, 'A4', '매월 납입액(원)'); cell(S, 'B4', p.A, MONEY);
    cell(S, 'A5', '연 수익률'); cell(S, 'B5', p.B / 100, '0.00%');
    cell(S, 'A6', '투자 기간(년)'); cell(S, 'B6', p.C);
    cell(S, 'A7', '납입 시점'); cell(S, 'B7', timingTxt); cell(S, 'C7', "'월말' 또는 '월초'를 입력");
    cell(S, 'A8', '수익률 적용 방식'); cell(S, 'B8', modeTxt); cell(S, 'C8', "'연÷12'(연 수익률÷12를 매달 적용) 또는 '연실효'");
    cell(S, 'A9', '월 수익률'); cell(S, 'B9', s.r, '0.0000%', 'IF(B8="연실효",(1+B5)^(1/12)-1,B5/12)');
    cell(S, 'A11', '[결과]');
    cell(S, 'A12', '최종 금액(원)'); cell(S, 'B12', s.final, MONEY, "'월별'!F" + last);
    cell(S, 'A13', '총 납입 원금(원)'); cell(S, 'B13', s.dep, MONEY, 'B4*B6*12');
    cell(S, 'A14', '총 수익(원)'); cell(S, 'B14', gain, MONEY, 'B12-B13');
    cell(S, 'A15', '원금 대비 수익률'); cell(S, 'B15', s.dep ? gain / s.dep : 0, '0.0%', 'B14/B13');
    cell(S, 'A16', '공식 검산(원)'); cell(S, 'B16', s.final, MONEY, 'IF(B9=0,B4*B6*12,B4*((1+B9)^(B6*12)-1)/B9*IF(B7="월초",1+B9,1))');
    cell(S, 'A17', '검산 결과'); cell(S, 'B17', '일치', null, 'IF(ABS(B16-B12)<1,"일치","불일치")');
    cell(S, 'A19', '※ 납입액·수익률·납입 시점·적용 방식(B4, B5, B7, B8)을 바꾸면 월별·연도별 시트가 자동으로 다시 계산됩니다.');
    cell(S, 'A20', '※ 투자 기간은 월별 시트의 행 수로 정해지므로, 기간을 바꾸려면 웹 계산기에서 다시 내려받아 주세요.');
    cell(S, 'A21', '※ 세전 기준이며 수수료·세금·물가 상승은 반영하지 않은 단순 시뮬레이션입니다.');
    S['!ref'] = 'A1:C21';
    S['!cols'] = [{wch: 24}, {wch: 20}, {wch: 52}];
    XLSX.utils.book_append_sheet(wb, S, '요약');

    var Y = {};
    ['연차', '누적 납입(원)', '연말 잔액(원)', '누적 수익(원)', '그해 수익(원)'].forEach(function(h, i){ cell(Y, 'ABCDE'[i] + '1', h); });
    s.yearly.forEach(function(r, i){
      var row = i + 2;
      cell(Y, 'A' + row, r.y);
      cell(Y, 'B' + row, r.dep, MONEY, "'요약'!$B$4*12*A" + row);
      cell(Y, 'C' + row, r.end, MONEY, "INDEX('월별'!$F$2:$F$" + last + ",A" + row + "*12)");
      cell(Y, 'D' + row, r.gain, MONEY, 'C' + row + '-B' + row);
      cell(Y, 'E' + row, r.yGain, MONEY, i === 0 ? 'D2' : 'D' + row + '-D' + (row - 1));
    });
    Y['!ref'] = 'A1:E' + (s.yearly.length + 1);
    Y['!cols'] = [{wch: 8}, {wch: 18}, {wch: 18}, {wch: 18}, {wch: 18}];
    XLSX.utils.book_append_sheet(wb, Y, '연도별');

    var M = {};
    ['월', '연차', '기초 잔액(원)', '납입(원)', '수익(원)', '기말 잔액(원)'].forEach(function(h, i){ cell(M, 'ABCDEF'[i] + '1', h); });
    s.months.forEach(function(r, i){
      var row = i + 2;
      cell(M, 'A' + row, r.m);
      cell(M, 'B' + row, r.y, null, 'ROUNDUP(A' + row + '/12,0)');
      cell(M, 'C' + row, r.begin, MONEY, i === 0 ? null : 'F' + (row - 1));
      cell(M, 'D' + row, r.dep, MONEY, "'요약'!$B$4");
      cell(M, 'E' + row, r.interest, MONEY, 'IF(\'요약\'!$B$7="월초",C' + row + '+D' + row + ',C' + row + ')*\'요약\'!$B$9');
      cell(M, 'F' + row, r.end, MONEY, 'C' + row + '+D' + row + '+E' + row);
    });
    M['!ref'] = 'A1:F' + last;
    M['!cols'] = [{wch: 6}, {wch: 6}, {wch: 18}, {wch: 14}, {wch: 16}, {wch: 18}];
    XLSX.utils.book_append_sheet(wb, M, '월별');

    XLSX.writeFile(wb, '적립식투자계산_v1.xlsx');
  }

  ['b', 'c'].forEach(function(id){ $(id).addEventListener('input', render); });
  ['t', 'm'].forEach(function(id){ $(id).addEventListener('change', render); });
  $('a').addEventListener('input', function(e){
    var el = e.target, d = el.value.replace(/\D/g, '').slice(0, 11);
    var fromEnd = el.value.length - (el.selectionStart || 0);
    el.value = d ? nf.format(+d) : '';
    var pos = Math.max(0, el.value.length - fromEnd);
    try { el.setSelectionRange(pos, pos); } catch (x) {}
    render();
  });
  $('dl').addEventListener('click', exportXlsx);
  var rz = null, lastW = 0;
  window.addEventListener('resize', function(){
    clearTimeout(rz);
    rz = setTimeout(function(){
      var w = $('chart').clientWidth;
      if (state && w && Math.abs(w - lastW) > 8){ lastW = w; chart(state.yearly); }
    }, 150);
  });
  render();
  lastW = $('chart').clientWidth;
})();
</script>
</body>
</html>
